# 予算プラン（やす旅・ゆる旅・らぐ旅）共通タグマスター
# 各destinations.ymlのbudget_tagsは、ここに定義されたidのみを参照すること。
# タグ名の変更・停止はここだけを直せばよく、destinations.yml側（id参照）は壊れない。
