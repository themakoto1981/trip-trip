<div class="share-bar{% if include.position %} share-bar--{{ include.position }}{% endif %}">
  <span class="share-bar-label">この記事をシェア</span>
  <div class="share-bar-wrap">
    <button type="button" class="share-bar-btn" data-share-url="{{ page.url | absolute_url }}" data-share-title="{{ page.title | escape }}" aria-label="シェア" aria-haspopup="true" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a1 1 0 0 1 1 1v10.59l2.3-2.3a1 1 0 1 1 1.4 1.42l-4 4a1 1 0 0 1-1.4 0l-4-4a1 1 0 1 1 1.4-1.42l2.3 2.3V3a1 1 0 0 1 1-1Z"></path><path d="M5 13a1 1 0 0 1 1 1v5a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-5a1 1 0 1 1 2 0v5a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3v-5a1 1 0 0 1 1-1Z"></path></svg>
    </button>
    <div class="share-bar-menu" hidden role="menu">
      <a class="share-bar-menu-item" target="_blank" rel="noopener" role="menuitem" data-share-template="https://twitter.com/intent/tweet?url={url}&text={title}">
        <span class="share-bar-menu-icon share-bar-menu-icon--x"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.9 2H22l-7.6 8.7L23.3 22h-7l-5.5-7.2L4.5 22H1.3l8.2-9.4L1 2h7.2l5 6.6L18.9 2Zm-1.2 18h1.7L7.4 4h-1.8l12.1 16Z"></path></svg></span>
        X
      </a>
      <a class="share-bar-menu-item" target="_blank" rel="noopener" role="menuitem" data-share-template="https://social-plugins.line.me/lineit/share?url={url}&text={title}">
        <span class="share-bar-menu-icon share-bar-menu-icon--line"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C6.48 2 2 5.69 2 10.2c0 4.02 3.52 7.38 8.28 8.03.32.07.76.21.87.49.1.25.07.65.03.9l-.14.84c-.04.25-.19.97.85.53 1.04-.44 5.6-3.3 7.64-5.65C20.9 13.8 22 12.1 22 10.2 22 5.69 17.52 2 12 2Z"></path></svg></span>
        LINE
      </a>
      <a class="share-bar-menu-item" target="_blank" rel="noopener" role="menuitem" data-share-template="https://www.facebook.com/sharer/sharer.php?u={url}">
        <span class="share-bar-menu-icon share-bar-menu-icon--fb"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 21v-7.6h2.55l.38-2.96h-2.93V8.56c0-.86.24-1.44 1.47-1.44h1.57V4.46C16.22 4.4 15.33 4.3 14.3 4.3c-2.17 0-3.66 1.32-3.66 3.76v2.38H8.08v2.96h2.56V21h2.86Z"></path></svg></span>
        Facebook
      </a>
      <button type="button" class="share-bar-menu-item" role="menuitem" data-copy-link>
        <span class="share-bar-menu-icon share-bar-menu-icon--link"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.6 13.4a1 1 0 0 1 0-1.4l3-3a3.5 3.5 0 0 1 4.9 4.9l-1.6 1.6a1 1 0 1 1-1.4-1.4l1.6-1.6a1.5 1.5 0 0 0-2.1-2.1l-3 3a1 1 0 0 1-1.4 0Zm2.8-2.8a1 1 0 0 1 0 1.4l-3 3a3.5 3.5 0 0 1-4.9-4.9l1.6-1.6a1 1 0 1 1 1.4 1.4l-1.6 1.6a1.5 1.5 0 0 0 2.1 2.1l3-3a1 1 0 0 1 1.4 0Z"></path></svg></span>
        <span data-copy-label>リンクをコピー</span>
      </button>
    </div>
  </div>
</div>
