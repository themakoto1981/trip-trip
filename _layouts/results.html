---
layout: default
---
<style>
  #result-list { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 1.5rem; }
  #result-list li.result-card {
    padding-bottom: 1.5rem;
    border-bottom: 1px solid var(--sb-border);
  }
  #result-list li.result-card:last-child { border-bottom: none; padding-bottom: 0; }
  .result-banner-link { display: block; }
  .result-banner {
    width: 100%;
    height: 44vw;
    max-height: 220px;
    min-height: 140px;
    object-fit: cover;
    border-radius: 2px;
    margin-bottom: 0.75rem;
  }
  .result-card-head {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 0.6rem;
    margin-bottom: 0.3rem;
  }
  .result-name { font-weight: 700; font-size: 1.1rem; }
  .result-card-price {
    font-family: "Noto Serif JP", serif;
    font-weight: 700;
    font-size: 1.3rem;
    color: var(--sb-green-dark);
    margin-bottom: 0.2rem;
  }
  .result-card-meta { color: var(--sb-brown-soft); font-size: 0.9rem; margin-bottom: 0.5rem; }
  .result-card-desc { color: var(--sb-brown-soft); font-size: 0.88rem; line-height: 1.6; margin: 0.1rem 0 0.5rem; }
  .result-breakdown summary {
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--sb-green);
    list-style: none;
  }
  .result-breakdown summary::-webkit-details-marker { display: none; }
  .result-breakdown summary::before { content: "内訳を見る ▾"; }
  .result-breakdown[open] summary::before { content: "内訳を閉じる ▴"; }
  .no-result { color: #888; }
  .mini-season { display: inline; font-size: 0.8rem; font-weight: 700; }
  .mini-season.on { color: var(--sb-green); }
  .mini-season.off { color: var(--sb-brown-soft); font-weight: 500; }
  .mini-season.warn { color: #B54A32; }
  .search-summary { color: var(--sb-brown-soft); margin-bottom: 1.25rem; }
  .back-link { display: inline-block; margin-top: 1.5rem; }
  .cost-breakdown { list-style: none; padding: 0; margin: 0.6rem 0 0; font-size: 0.85rem; color: var(--sb-brown-soft); line-height: 1.7; }
  .beach-rating-box { background: #fff; border: 1px solid var(--sb-border); border-radius: 12px; padding: 0.85rem 1rem; margin: 0.4rem 0 0.6rem; }
  .beach-rating-box-head { display: flex; align-items: baseline; justify-content: space-between; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.5rem; }
  .beach-rating-beach { font-size: 0.8rem; color: var(--sb-brown-soft); }
  .beach-wave-badge { background: var(--sb-cream); border: 1px solid var(--sb-border); color: var(--sb-brown-soft); font-size: 0.72rem; font-weight: 700; padding: 2px 10px; border-radius: 999px; white-space: nowrap; }
  .beach-rating-rows { display: flex; flex-direction: column; gap: 0.3rem; }
  .beach-rating-row { display: flex; align-items: center; gap: 0.5rem; }
  .beach-rating-label { font-size: 0.78rem; color: var(--sb-brown-soft); width: 76px; flex-shrink: 0; }
  .beach-rating-stars { display: flex; gap: 2px; }
  .beach-rating-na { font-size: 0.75rem; color: var(--sb-brown-soft); }
  .beach-rating-detail summary {
    cursor: pointer;
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--sb-green);
    list-style: none;
    margin-top: 0.4rem;
  }
  .beach-rating-detail summary::-webkit-details-marker { display: none; }
  .beach-rating-detail summary::before { content: "評価の詳細を見る ▾"; }
  .beach-rating-detail[open] summary::before { content: "評価の詳細を閉じる ▴"; }
  .beach-rating-detail-row { margin: 0.6rem 0 0; display: flex; flex-direction: column; gap: 2px; }
  .beach-rating-detail-row-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .beach-rating-detail-label { font-size: 0.82rem; font-weight: 600; color: var(--sb-green-dark); }
  .beach-rating-detail-desc { font-size: 0.78rem; color: var(--sb-brown-soft); line-height: 1.55; }
  .beach-rating-note { background: var(--sb-cream); border-left: 3px solid var(--sb-gold); padding: 0.5rem 0.7rem; border-radius: 8px; font-size: 0.76rem; color: var(--sb-brown-soft); line-height: 1.6; margin-top: 0.7rem; }
</style>

<h1>検索結果</h1>
<p class="search-summary" id="search-summary"></p>
<ul id="result-list"></ul>
<a class="back-link" id="back-link" href="{{ '/' | relative_url }}">← 条件を変更する</a>

<script>
  var destinations = {{ site.data.destinations | jsonify }};
  document.getElementById('back-link').href = '{{ site.baseurl }}/' + window.location.search;

  var params = new URLSearchParams(window.location.search);
  var monthParam = params.get('month') || '';
  var nights = parseInt(params.get('nights') || '3', 10);
  var budget = params.get('budget') || '';
  var companion = params.get('companion') || '';
  var tag1 = params.get('tag1') || '';
  var tag2 = params.get('tag2') || '';
  var waves = params.get('waves') || '';

  var nightsLabelMap = { 1: '1泊2日', 2: '2泊3日', 3: '3泊4日', 4: '4泊5日', 6: '5泊以上' };
  var budgetLabelMap = { '80000': '8万円まで', '120000': '12万円まで', '180000': '18万円まで', '250000': '25万円まで', '400000': '40万円まで', '999999999': '上限なし' };
  var companionLabelMap = { solo: '一人旅', couple: 'カップル・夫婦', family: '家族', friends: '友人グループ' };
  var tagLabelMap = { beach: '透明な海', resort: 'リゾート', island: '島', city_base: '街拠点', sightseeing: '観光', relax: 'まったり', party: 'パーティ', activity: 'アクティビティ' };
  var wavesLabelMap = { 'なし': '波なし希望', 'あり': '波あり希望' };

  var RUBRIC = {
    visibility: { 5: 'くっきり見えて砂紋や小石まで分かる', 4: 'はっきり見えるが細部は少しぼやける', 3: '見えるが輪郭がぼやける', 2: 'うっすら見える程度', 1: '濁っていてほとんど見えない' },
    underwater: { 5: 'サンゴが広く群生、魚の種類も数もとても多い', 4: 'サンゴと魚のどちらも多い', 3: 'それなりに見られる', 2: 'まばらにしかいない', 1: 'ほとんど見られない' },
    sand: { 5: '白っぽく明るい色でパウダー状に細かく均一', 4: '明るい色で細かいが少し混じりもの', 3: 'ふつうの砂浜', 2: '粒が粗い、小石・貝殻・サンゴのかけらが多い', 1: '砂利や岩が中心、または色や粒がばらばら' }
  };

  function starsSvg(value) {
    var html = '';
    for (var i = 0; i < 5; i++) {
      var fill = (value !== null && value !== undefined && i < value) ? '#00704A' : '#E5DDCC';
      html += '<svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 21 12 17.27 5.82 21 7 14.14l-5-4.87 6.91-1.01L12 2z" fill="' + fill + '"></path></svg>';
    }
    return html;
  }

  function beachRatingBoxHtml(d) {
    if (!d.beach_name) { return ''; }
    var compactRows = [
      { label: '海の透明感', key: 'visibility', value: d.beach_visibility },
      { label: '魚・サンゴ', key: 'underwater', value: d.beach_underwater },
      { label: '砂の質', key: 'sand', value: d.beach_sand }
    ];
    var compactHtml = compactRows.map(function (r) {
      var stars = (r.value === null || r.value === undefined)
        ? '<span class="beach-rating-na">評価準備中</span>'
        : starsSvg(r.value);
      return '<div class="beach-rating-row"><span class="beach-rating-label">' + r.label + '</span><span class="beach-rating-stars">' + stars + '</span></div>';
    }).join('');
    var detailLabels = { visibility: '①浅瀬の海底視認性', underwater: '②水中の美しさ', sand: '③砂の美しさ' };
    var detailHtml = compactRows.map(function (r) {
      var desc = (r.value === null || r.value === undefined)
        ? '情報が十分でないため未評価です。'
        : (RUBRIC[r.key][r.value] || '');
      var stars = (r.value === null || r.value === undefined) ? '' : starsSvg(r.value);
      return '<div class="beach-rating-detail-row"><div class="beach-rating-detail-row-head"><span class="beach-rating-detail-label">' + detailLabels[r.key] + '</span><span class="beach-rating-stars">' + stars + '</span></div><div class="beach-rating-detail-desc">' + desc + '</div></div>';
    }).join('');
    if (d.beach_note) {
      detailHtml += '<div class="beach-rating-note">補足：' + d.beach_note + '</div>';
    }
    var waveBadge = d.beach_waves ? '<span class="beach-wave-badge">波' + d.beach_waves + '</span>' : '';
    return '<div class="beach-rating-box">' +
      '<div class="beach-rating-box-head"><span class="beach-rating-beach">おすすめビーチ：' + d.beach_name + '</span>' + waveBadge + '</div>' +
      '<div class="beach-rating-rows">' + compactHtml + '</div>' +
      '<details class="beach-rating-detail"><summary></summary>' + detailHtml + '</details>' +
      '</div>';
  }

  var currentMonth = monthParam ? parseInt(monthParam, 10) : (new Date().getMonth() + 1);

  var summaryParts = [currentMonth + '月', nightsLabelMap[nights] || nights + '泊'];
  if (budget) { summaryParts.push('予算 ' + (budgetLabelMap[budget] || budget + '円')); }
  if (companion) { summaryParts.push(companionLabelMap[companion] || companion); }
  if (tag1 && tag2) { summaryParts.push((tagLabelMap[tag1] || tag1) + '×' + (tagLabelMap[tag2] || tag2)); }
  if (waves) { summaryParts.push(wavesLabelMap[waves] || waves); }
  document.getElementById('search-summary').textContent = '条件: ' + summaryParts.join('／');

  var withTotals = destinations.map(function (d) {
    var stayMin = (d.yasu_hotel + d.yasu_transport + d.yasu_food) * nights;
    var stayMax = (d.ragu_hotel + d.ragu_transport + d.ragu_food) * nights;
    var totalMin = d.flight_min + stayMin;
    var totalMax = d.flight_max + stayMax;
    var inSeason = !d.best_months || d.best_months.indexOf(currentMonth) !== -1;
    var matchesCompanion = !companion || (d.suited_for && d.suited_for.indexOf(companion) !== -1);
    var minNightsMatch = (d.recommended_nights || '').match(/(\d+)/);
    var minNights = minNightsMatch ? parseInt(minNightsMatch[1], 10) : null;
    var tooShort = minNights !== null && nights < minNights;
    var tagScore = (tag1 && tag2 && d.tags)
      ? (d.tags[tag1] || 0) + (d.tags[tag2] || 0)
      : null;
    return Object.assign({}, d, { totalMin: totalMin, totalMax: totalMax, inSeason: inSeason, matchesCompanion: matchesCompanion, tooShort: tooShort, tagScore: tagScore });
  });

  var budgetFiltered = withTotals.filter(function (d) {
    return !budget || d.totalMin <= parseInt(budget, 10);
  });
  var feasible = budgetFiltered.filter(function (d) { return !d.tooShort; });
  var allTooShort = budgetFiltered.length > 0 && feasible.length === 0;
  var nightsBase = allTooShort ? budgetFiltered : feasible;

  var wavesBase = nightsBase.filter(function (d) { return !waves || d.beach_waves === waves; });
  var allWavesMismatch = nightsBase.length > 0 && wavesBase.length === 0;
  var wavesResult = allWavesMismatch ? nightsBase : wavesBase;

  var inSeasonBase = wavesResult.filter(function (d) { return d.inSeason; });
  var allOffSeason = wavesResult.length > 0 && inSeasonBase.length === 0;
  var filtered = (allOffSeason ? nightsBase : inSeasonBase).sort(function (a, b) {
    if (a.tagScore !== null && b.tagScore !== null && a.tagScore !== b.tagScore) { return b.tagScore - a.tagScore; }
    if (a.matchesCompanion !== b.matchesCompanion) { return a.matchesCompanion ? -1 : 1; }
    if (a.inSeason !== b.inSeason) { return a.inSeason ? -1 : 1; }
    return a.totalMin - b.totalMin;
  });
  if (allWavesMismatch) {
    var warnEl3 = document.createElement('p');
    warnEl3.style.cssText = 'background:#F3ECE0;color:#8a6d3b;padding:0.75rem 1rem;border-radius:8px;margin-bottom:1.25rem;font-weight:600;';
    warnEl3.textContent = '「' + (wavesLabelMap[waves] || waves) + '」に完全一致する島が見つかりませんでした。（以下は参考情報として表示しています）';
    document.getElementById('search-summary').insertAdjacentElement('afterend', warnEl3);
  }
  if (allOffSeason) {
    var warnEl2 = document.createElement('p');
    warnEl2.style.cssText = 'background:#F3ECE0;color:#8a6d3b;padding:0.75rem 1rem;border-radius:8px;margin-bottom:1.25rem;font-weight:600;';
    warnEl2.textContent = currentMonth + '月はベストシーズンの島がありません。（以下はオフシーズンの参考情報として表示しています）';
    document.getElementById('search-summary').insertAdjacentElement('afterend', warnEl2);
  }
  if (allTooShort) {
    var minNightsValues = withTotals.map(function (d) {
      var m = (d.recommended_nights || '').match(/(\d+)/);
      return m ? parseInt(m[1], 10) : null;
    }).filter(function (n) { return n !== null; });
    var easiestMin = minNightsValues.length ? Math.min.apply(null, minNightsValues) : null;
    var warnEl = document.createElement('p');
    warnEl.style.cssText = 'background:#FCEAE6;color:#B54A32;padding:0.75rem 1rem;border-radius:8px;margin-bottom:1.25rem;font-weight:600;';
    warnEl.textContent = 'この日数（' + (nightsLabelMap[nights] || nights + '泊') + '）では、移動時間を考えると現実的に行ける島がありません。' + (easiestMin ? '最低' + easiestMin + '泊以上での検索をおすすめします。' : '') + '（以下は参考情報として表示しています）';
    document.getElementById('search-summary').insertAdjacentElement('afterend', warnEl);
  }

  var list = document.getElementById('result-list');
  if (filtered.length === 0) {
    list.innerHTML = '<li class="no-result">条件に合う島がまだ見つかりませんでした。記事は随時追加中です。</li>';
  } else {
    filtered.forEach(function (d) {
      var li = document.createElement('li');
      li.className = 'result-card';
      var targetUrl = '{{ site.baseurl }}' + d.url;
      var seasonBadge = d.inSeason
        ? '<span class="mini-season on">今がベストシーズン</span>'
        : '<span class="mini-season off">オフシーズン</span>';
      var companionBadge = companion
        ? (d.matchesCompanion
            ? '<span class="mini-season on">' + (companionLabelMap[companion] || companion) + '向き</span>'
            : '')
        : '';
      var tagBadge = (d.tagScore !== null)
        ? '<span class="mini-season on">相性スコア ' + d.tagScore + '/10</span>'
        : '';
      var hotelTotalMin = d.yasu_hotel * nights, hotelTotalMax = d.ragu_hotel * nights;
      var transportTotalMin = d.yasu_transport * nights, transportTotalMax = d.ragu_transport * nights;
      var foodTotalMin = d.yasu_food * nights, foodTotalMax = d.ragu_food * nights;
      var breakdown = '<ul class="cost-breakdown">' +
        '<li>航空券（往復）: ' + d.flight_min.toLocaleString() + '〜' + d.flight_max.toLocaleString() + '円</li>' +
        '<li>宿泊（' + (nightsLabelMap[nights] || nights + '泊') + '）: ' + hotelTotalMin.toLocaleString() + '〜' + hotelTotalMax.toLocaleString() + '円</li>' +
        '<li>現地移動（' + (nightsLabelMap[nights] || nights + '日') + '）: ' + transportTotalMin.toLocaleString() + '〜' + transportTotalMax.toLocaleString() + '円</li>' +
        '<li>食費・アクティビティ（' + (nightsLabelMap[nights] || nights + '日') + '）: ' + foodTotalMin.toLocaleString() + '〜' + foodTotalMax.toLocaleString() + '円</li>' +
        '</ul>';
      li.innerHTML =
        (d.photo ? '<a class="result-banner-link" href="' + targetUrl + '"><img class="result-banner" src="' + d.photo + '" alt="' + d.name + '" loading="lazy"></a>' : '') +
        '<div class="result-card-head">' +
        '<a class="result-name" href="' + targetUrl + '">' + d.name + '（' + d.country + '）</a> ' + seasonBadge + ' ' + companionBadge + ' ' + tagBadge +
        '</div>' +
        (d.description ? '<p class="result-card-desc">' + d.description + '</p>' : '') +
        '<div class="result-card-price">目安総額 ' + d.totalMin.toLocaleString() + '〜' + d.totalMax.toLocaleString() + '円</div>' +
        '<div class="result-card-meta">おすすめ月: ' + d.best_months.join(', ') + '月</div>' +
        beachRatingBoxHtml(d) +
        '<details class="result-breakdown"><summary></summary>' + breakdown + '</details>';
      list.appendChild(li);
    });
  }
</script>
