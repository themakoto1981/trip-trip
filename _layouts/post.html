---
layout: default
---
<article class="post h-entry" itemscope itemtype="http://schema.org/BlogPosting">

  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">{{ page.title | escape }}</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="{{ page.date | date_to_xmlschema }}" itemprop="datePublished">
        {%- assign date_format = site.minima.date_format | default: "%Y年%-m月%-d日" -%}
        {{ page.date | date: date_format }}
      </time>
      {%- if page.author -%}
        • <span itemprop="author" itemscope itemtype="http://schema.org/Person"><span class="p-author h-card" itemprop="name">{{ page.author }}</span></span>
      {%- endif -%}
    </p>
  </header>

  <div id="quick-facts"></div>

  <div class="post-content e-content" itemprop="articleBody">
    {{ content }}
  </div>

  <script>
  (function () {
    var destinations = {{ site.data.destinations | jsonify }};
    var pageUrl = "{{ page.url }}";
    var match = null;
    for (var i = 0; i < destinations.length; i++) {
      if (destinations[i].url === pageUrl) { match = destinations[i]; break; }
    }
    if (!match) { return; }

    var month = new Date().getMonth() + 1;
    var inSeason = !match.best_months || match.best_months.indexOf(month) !== -1;
    var seasonHtml = inSeason
      ? '<span class="season-pill season-on">🟢 今がベストシーズン</span>'
      : '<span class="season-pill season-off">🌙 今はオフシーズン</span>';

    var totalMin = match.flight_min + match.daily_min * 2;
    var totalMax = match.flight_max + match.daily_max * 2;

    var rows = [
      ['国', match.country],
      ['目安予算（2泊3日〜）', totalMin.toLocaleString() + '〜' + totalMax.toLocaleString() + '円'],
      ['現地までの移動時間', match.flight_hours || '-'],
      ['おすすめ日程', match.recommended_nights || '-'],
      ['ベストシーズン', (match.best_months ? match.best_months.join('・') + '月　' : '') + seasonHtml]
    ];

    var html = '<div class="quick-facts-box"><dl>';
    rows.forEach(function (r) {
      html += '<dt>' + r[0] + '</dt><dd>' + r[1] + '</dd>';
    });
    html += '</dl></div>';

    document.getElementById('quick-facts').innerHTML = html;
  })();
  </script>

  {%- include comments.html -%}

  <a class="u-url" href="{{ page.url | relative_url }}" hidden></a>

</article>
