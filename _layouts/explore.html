---
layout: default
---
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  #search-panel { display: flex; flex-wrap: wrap; gap: 1rem; align-items: flex-end; margin: 1.5rem 0; padding: 1rem; border: 1px solid #ddd; border-radius: 8px; }
  #search-panel div { display: flex; flex-direction: column; }
  #search-panel label { font-size: 0.85rem; margin-bottom: 0.25rem; color: #555; }
  #trip-map { height: 480px; width: 100%; border-radius: 8px; margin-bottom: 0.5rem; }
  .map-hint { font-size: 0.85rem; color: #6B5A4A; margin: 0 0 1.5rem; }
  .leaflet-marker-icon { cursor: pointer; }
  .island-label {
    background: #fff; color: #1E3932; font-weight: 600; font-size: 0.8rem;
    padding: 2px 8px; border-radius: 10px; border: 1px solid #E5DDCC;
    box-shadow: 0 1px 4px rgba(0,0,0,0.15);
    white-space: nowrap;
    pointer-events: auto !important;
  }
  .island-label::before { display: none; }
  .island-label a { color: inherit; text-decoration: none; cursor: pointer; pointer-events: auto !important; }
  .island-label a:hover { text-decoration: underline; }
  #result-list { list-style: none; padding: 0; }
  #result-list li { padding: 0.75rem 0; border-bottom: 1px solid #eee; }
  #result-list a { font-weight: 600; }
  .no-result { color: #888; }
  .page-tagline { font-size: 0.95rem; color: #666; font-weight: normal; margin-top: -0.5rem; }

  .island-star {
    font-size: 20px; line-height: 1; color: #00704A;
    text-shadow: 0 1px 2px rgba(0,0,0,0.35), 0 0 1px #fff;
  }

  .mini-season { display: inline-block; font-size: 0.75rem; font-weight: 600; padding: 1px 8px; border-radius: 10px; }
  .mini-season.on { background: #E4F3EC; color: #00704A; }
  .mini-season.off { background: #F3ECE0; color: #8a6d3b; }
</style>

{{ content }}

<div id="search-panel">
  <div>
    <label for="nights">旅行日程</label>
    <select id="nights">
      <option value="1">1泊2日</option>
      <option value="2" selected>2泊3日</option>
      <option value="3">3泊4日</option>
      <option value="4">4泊5日</option>
      <option value="6">5泊以上</option>
    </select>
  </div>
  <div>
    <label for="budget">予算（総額・上限）</label>
    <select id="budget">
      <option value="">指定なし</option>
      <option value="80000">8万円まで</option>
      <option value="120000">12万円まで</option>
      <option value="180000">18万円まで</option>
      <option value="250000">25万円まで</option>
      <option value="400000">40万円まで</option>
      <option value="999999999">上限なし</option>
    </select>
  </div>
</div>

<div id="trip-map"></div>

<h2>検索結果</h2>
<ul id="result-list"></ul>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  var destinations = {{ site.data.destinations | jsonify }};

  var map = L.map('trip-map', { scrollWheelZoom: false });
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  var islandIcon = L.divIcon({
    className: 'island-pin-wrapper',
    html: '<div class="island-star">★</div>',
    iconSize: [20, 20],
    iconAnchor: [10, 10],
    popupAnchor: [0, -10]
  });

  var markers = [];
  destinations.forEach(function (d) {
    var marker = L.marker([d.lat, d.lng], { icon: islandIcon }).addTo(map);
    var targetUrl = '{{ site.baseurl }}' + d.url;
    marker.bindTooltip('<a href="' + targetUrl + '">' + d.name + '</a>', { permanent: true, direction: 'top', offset: [0, -10], className: 'island-label' });
    marker.on('click', function () { window.location.href = targetUrl; });
    markers.push(marker);
  });

  if (markers.length > 0) {
    var group = L.featureGroup(markers);
    map.fitBounds(group.getBounds().pad(0.3));
    if (markers.length === 1) { map.setZoom(6); }
  } else {
    map.setView([15, 110], 3);
  }

  function renderResults() {
    var nights = parseInt(document.getElementById('nights').value, 10);
    var budget = document.getElementById('budget').value;
    var list = document.getElementById('result-list');
    list.innerHTML = '';

    var withTotals = destinations.map(function (d) {
      var totalMin = d.flight_min + d.daily_min * nights;
      var totalMax = d.flight_max + d.daily_max * nights;
      return Object.assign({}, d, { totalMin: totalMin, totalMax: totalMax });
    });

    var currentMonth = new Date().getMonth() + 1;

    var filtered = withTotals.filter(function (d) {
      var budgetOk = !budget || d.totalMin <= parseInt(budget, 10);
      return budgetOk;
    }).map(function (d) {
      d.inSeason = !d.best_months || d.best_months.indexOf(currentMonth) !== -1;
      return d;
    }).sort(function (a, b) {
      if (a.inSeason !== b.inSeason) { return a.inSeason ? -1 : 1; }
      return a.totalMin - b.totalMin;
    });

    if (filtered.length === 0) {
      list.innerHTML = '<li class="no-result">条件に合う島がまだ見つかりませんでした。記事は随時追加中です。</li>';
      return;
    }

    filtered.forEach(function (d) {
      var li = document.createElement('li');
      var seasonBadge = d.inSeason
        ? '<span class="mini-season on">🟢 今がベストシーズン</span>'
        : '<span class="mini-season off">🌙 オフシーズン</span>';
      li.innerHTML = '<a href="{{ site.baseurl }}' + d.url + '">' + d.name + '（' + d.country + '）</a> ' + seasonBadge +
        '<br>目安総額: ' + d.totalMin.toLocaleString() + '〜' + d.totalMax.toLocaleString() + '円' +
        '　おすすめ月: ' + d.best_months.join(', ') + '月';
      list.appendChild(li);
    });
  }

  document.getElementById('nights').addEventListener('change', renderResults);
  document.getElementById('budget').addEventListener('change', renderResults);
  renderResults();
</script>
