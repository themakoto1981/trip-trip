---
layout: default
---
<article class="post h-entry" itemscope itemtype="http://schema.org/BlogPosting">

  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">{{ page.title | escape }}</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="{{ page.date | date_to_xmlschema }}" itemprop="datePublished">
        {%- assign date_format = site.minima.date_format | default: "%Y年%-m月%-d日" -%}
        {{ page.date | date: date_format }}
      </time>
      {%- if page.author -%}
        • <span itemprop="author" itemscope itemtype="http://schema.org/Person"><span class="p-author h-card" itemprop="name">{{ page.author }}</span></span>
      {%- endif -%}
    </p>
  </header>

  <div id="season-badge"></div>

  <div class="post-content e-content" itemprop="articleBody">
    {{ content }}
  </div>

  <script>
  (function () {
    var destinations = {{ site.data.destinations | jsonify }};
    var pageUrl = "{{ page.url }}";
    var match = null;
    for (var i = 0; i < destinations.length; i++) {
      if (destinations[i].url === pageUrl) { match = destinations[i]; break; }
    }
    if (!match || !match.best_months) { return; }
    var month = new Date().getMonth() + 1;
    var inSeason = match.best_months.indexOf(month) !== -1;
    var el = document.getElementById('season-badge');
    if (inSeason) {
      el.innerHTML = '<span class="season-pill season-on">🟢 今はベストシーズンです</span>';
    } else {
      el.innerHTML = '<span class="season-pill season-off">🌙 今はオフシーズンです（おすすめ: ' + match.best_months.join('・') + '月）</span>';
    }
  })();
  </script>

  {%- include comments.html -%}

  <a class="u-url" href="{{ page.url | relative_url }}" hidden></a>

</article>
