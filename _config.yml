title: TRIP×TRIP
baseurl: "/trip-trip"
description: "東南アジアを中心に、島とビーチだけを集めた旅行ガイド。行き方・ベストシーズン・予算・持ち物までまとめて紹介します。"
lang: ja
ga4_id: "G-X4PC93H7ER"
theme: minima
minima:
  skin: auto
permalink: /:year/:month/:day/:title/
show_excerpts: true
future: true

collections:
  countries:
    output: true
    permalink: /country/:slug/

defaults:
  - scope:
      path: ""
      type: "countries"
    values:
      layout: "country"

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

header_pages:
  - articles.md
  - countries.md
  - submit.md

exclude:
  - README.md
