# flight_min/flight_max: 日本からの往復航空券の目安（円）
# hotel_min/hotel_max: 現地宿泊費（1泊あたり、円）
# transport_min/transport_max: 現地移動費（1日あたり、円）
# food_min/food_max: 食費・アクティビティ（1日あたり、円）
# flight_hours: 日本からの片道移動時間の目安（テキスト）
# recommended_nights: おすすめの宿泊日数（テキスト）
# suited_for: 向いている同行者タイプ（solo/couple/family/friends）
# best_months: おすすめの月（1-12の配列、記事内での参考表示用）
# lat/lng: 地図ピン用の緯度経度

