---
layout: default
---
<style>
  #result-list { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 1.5rem; }
  #result-list li.result-card {
    padding-bottom: 1.5rem;
    border-bottom: 1px solid var(--sb-border);
  }
  #result-list li.result-card:last-child { border-bottom: none; padding-bottom: 0; }
  .result-banner-link { display: block; }
  .result-banner {
    width: 100%;
    height: 44vw;
    max-height: 220px;
    min-height: 140px;
    object-fit: cover;
    border-radius: 2px;
    margin-bottom: 0.75rem;
  }
  .result-card-head {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 0.6rem;
    margin-bottom: 0.3rem;
  }
  .result-name { font-weight: 700; font-size: 1.1rem; }
  .result-card-price {
    font-family: "Noto Serif JP", serif;
    font-weight: 700;
    font-size: 1.3rem;
    color: var(--sb-green-dark);
    margin-bottom: 0.2rem;
  }
  .result-card-meta { color: var(--sb-brown-soft); font-size: 0.9rem; margin-bottom: 0.5rem; }
  .result-breakdown summary {
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--sb-green);
    list-style: none;
  }
  .result-breakdown summary::-webkit-details-marker { display: none; }
  .result-breakdown summary::before { content: "内訳を見る ▾"; }
  .result-breakdown[open] summary::before { content: "内訳を閉じる ▴"; }
  .no-result { color: #888; }
  .mini-season { display: inline; font-size: 0.8rem; font-weight: 700; }
  .mini-season.on { color: var(--sb-green); }
  .mini-season.off { color: var(--sb-brown-soft); font-weight: 500; }
  .mini-season.warn { color: #B54A32; }
  .search-summary { color: var(--sb-brown-soft); margin-bottom: 1.25rem; }
  .back-link { display: inline-block; margin-top: 1.5rem; }
  .cost-breakdown { list-style: none; padding: 0; margin: 0.6rem 0 0; font-size: 0.85rem; color: var(--sb-brown-soft); line-height: 1.7; }
</style>

<h1>検索結果</h1>
<p class="search-summary" id="search-summary"></p>
<ul id="result-list"></ul>
<a class="back-link" href="{{ '/' | relative_url }}">← 条件を変更する</a>

<script>
  var destinations = {{ site.data.destinations | jsonify }};
  var params = new URLSearchParams(window.location.search);
  var monthParam = params.get('month') || '';
  var nights = parseInt(params.get('nights') || '2', 10);
  var budget = params.get('budget') || '';
  var companion = params.get('companion') || '';

  var nightsLabelMap = { 1: '1泊2日', 2: '2泊3日', 3: '3泊4日', 4: '4泊5日', 6: '5泊以上' };
  var budgetLabelMap = { '80000': '8万円まで', '120000': '12万円まで', '180000': '18万円まで', '250000': '25万円まで', '400000': '40万円まで', '999999999': '上限なし' };
  var companionLabelMap = { solo: '一人旅', couple: 'カップル・夫婦', family: '家族', friends: '友人グループ' };

  var currentMonth = monthParam ? parseInt(monthParam, 10) : (new Date().getMonth() + 1);

  var summaryParts = [currentMonth + '月', nightsLabelMap[nights] || nights + '泊'];
  if (budget) { summaryParts.push('予算 ' + (budgetLabelMap[budget] || budget + '円')); }
  if (companion) { summaryParts.push(companionLabelMap[companion] || companion); }
  document.getElementById('search-summary').textContent = '条件: ' + summaryParts.join('／');

  var withTotals = destinations.map(function (d) {
    var stayMin = (d.hotel_min + d.transport_min + d.food_min) * nights;
    var stayMax = (d.hotel_max + d.transport_max + d.food_max) * nights;
    var totalMin = d.flight_min + stayMin;
    var totalMax = d.flight_max + stayMax;
    var inSeason = !d.best_months || d.best_months.indexOf(currentMonth) !== -1;
    var matchesCompanion = !companion || (d.suited_for && d.suited_for.indexOf(companion) !== -1);
    var minNightsMatch = (d.recommended_nights || '').match(/(\d+)/);
    var minNights = minNightsMatch ? parseInt(minNightsMatch[1], 10) : null;
    var tooShort = minNights !== null && nights < minNights;
    return Object.assign({}, d, { totalMin: totalMin, totalMax: totalMax, inSeason: inSeason, matchesCompanion: matchesCompanion, tooShort: tooShort });
  });

  var budgetFiltered = withTotals.filter(function (d) {
    return !budget || d.totalMin <= parseInt(budget, 10);
  });
  var feasible = budgetFiltered.filter(function (d) { return !d.tooShort; });
  var allTooShort = budgetFiltered.length > 0 && feasible.length === 0;
  var nightsBase = allTooShort ? budgetFiltered : feasible;

  var inSeasonBase = nightsBase.filter(function (d) { return d.inSeason; });
  var allOffSeason = nightsBase.length > 0 && inSeasonBase.length === 0;
  var filtered = (allOffSeason ? nightsBase : inSeasonBase).sort(function (a, b) {
    if (a.matchesCompanion !== b.matchesCompanion) { return a.matchesCompanion ? -1 : 1; }
    if (a.inSeason !== b.inSeason) { return a.inSeason ? -1 : 1; }
    return a.totalMin - b.totalMin;
  });
  if (allOffSeason) {
    var warnEl2 = document.createElement('p');
    warnEl2.style.cssText = 'background:#F3ECE0;color:#8a6d3b;padding:0.75rem 1rem;border-radius:8px;margin-bottom:1.25rem;font-weight:600;';
    warnEl2.textContent = currentMonth + '月はベストシーズンの島がありません。（以下はオフシーズンの参考情報として表示しています）';
    document.getElementById('search-summary').insertAdjacentElement('afterend', warnEl2);
  }
  if (allTooShort) {
    var minNightsValues = withTotals.map(function (d) {
      var m = (d.recommended_nights || '').match(/(\d+)/);
      return m ? parseInt(m[1], 10) : null;
    }).filter(function (n) { return n !== null; });
    var easiestMin = minNightsValues.length ? Math.min.apply(null, minNightsValues) : null;
    var warnEl = document.createElement('p');
    warnEl.style.cssText = 'background:#FCEAE6;color:#B54A32;padding:0.75rem 1rem;border-radius:8px;margin-bottom:1.25rem;font-weight:600;';
    warnEl.textContent = 'この日数（' + (nightsLabelMap[nights] || nights + '泊') + '）では、移動時間を考えると現実的に行ける島がありません。' + (easiestMin ? '最低' + easiestMin + '泊以上での検索をおすすめします。' : '') + '（以下は参考情報として表示しています）';
    document.getElementById('search-summary').insertAdjacentElement('afterend', warnEl);
  }

  var list = document.getElementById('result-list');
  if (filtered.length === 0) {
    list.innerHTML = '<li class="no-result">条件に合う島がまだ見つかりませんでした。記事は随時追加中です。</li>';
  } else {
    filtered.forEach(function (d) {
      var li = document.createElement('li');
      li.className = 'result-card';
      var targetUrl = '{{ site.baseurl }}' + d.url;
      var seasonBadge = d.inSeason
        ? '<span class="mini-season on">今がベストシーズン</span>'
        : '<span class="mini-season off">オフシーズン</span>';
      var companionBadge = companion
        ? (d.matchesCompanion
            ? '<span class="mini-season on">' + (companionLabelMap[companion] || companion) + '向き</span>'
            : '')
        : '';
      var hotelTotalMin = d.hotel_min * nights, hotelTotalMax = d.hotel_max * nights;
      var transportTotalMin = d.transport_min * nights, transportTotalMax = d.transport_max * nights;
      var foodTotalMin = d.food_min * nights, foodTotalMax = d.food_max * nights;
      var breakdown = '<ul class="cost-breakdown">' +
        '<li>航空券（往復）: ' + d.flight_min.toLocaleString() + '〜' + d.flight_max.toLocaleString() + '円</li>' +
        '<li>宿泊（' + nights + '泊）: ' + hotelTotalMin.toLocaleString() + '〜' + hotelTotalMax.toLocaleString() + '円</li>' +
        '<li>現地移動（' + nights + '日）: ' + transportTotalMin.toLocaleString() + '〜' + transportTotalMax.toLocaleString() + '円</li>' +
        '<li>食費・アクティビティ（' + nights + '日）: ' + foodTotalMin.toLocaleString() + '〜' + foodTotalMax.toLocaleString() + '円</li>' +
        '</ul>';
      li.innerHTML =
        (d.photo ? '<a class="result-banner-link" href="' + targetUrl + '"><img class="result-banner" src="' + d.photo + '" alt="' + d.name + '" loading="lazy"></a>' : '') +
        '<div class="result-card-head">' +
        '<a class="result-name" href="' + targetUrl + '">' + d.name + '（' + d.country + '）</a> ' + seasonBadge + ' ' + companionBadge +
        '</div>' +
        '<div class="result-card-price">目安総額 ' + d.totalMin.toLocaleString() + '〜' + d.totalMax.toLocaleString() + '円</div>' +
        '<div class="result-card-meta">おすすめ月: ' + d.best_months.join(', ') + '月</div>' +
        '<details class="result-breakdown"><summary></summary>' + breakdown + '</details>';
      list.appendChild(li);
    });
  }
</script>
