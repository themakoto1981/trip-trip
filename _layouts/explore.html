---
layout: default
---
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  #search-panel { display: flex; flex-wrap: wrap; gap: 1rem; align-items: flex-end; margin: 1.5rem 0; padding: 1rem; border: 1px solid #ddd; border-radius: 8px; }
  #search-panel div { display: flex; flex-direction: column; }
  #search-panel label { font-size: 0.85rem; margin-bottom: 0.25rem; color: #555; }
  #trip-map { height: 420px; width: 100%; border-radius: 8px; margin-bottom: 1.5rem; }
  #result-list { list-style: none; padding: 0; }
  #result-list li { padding: 0.75rem 0; border-bottom: 1px solid #eee; }
  #result-list a { font-weight: 600; }
  .no-result { color: #888; }
  .page-tagline { font-size: 0.95rem; color: #666; font-weight: normal; margin-top: -0.5rem; }

  .island-pin {
    width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    background: #1a7a7a;
    border: 2px solid #fff;
    border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg);
    box-shadow: 0 2px 5px rgba(0,0,0,0.35);
  }
  .island-pin span { transform: rotate(45deg); font-size: 14px; line-height: 1; }
</style>

<h1>{{ site.title }}</h1>
<p class="page-tagline">{{ site.description }}</p>
{{ content }}

<div id="search-panel">
  <div>
    <label for="nights">旅行日程</label>
    <select id="nights">
      <option value="1">1泊2日</option>
      <option value="2" selected>2泊3日</option>
      <option value="3">3泊4日</option>
      <option value="4">4泊5日</option>
      <option value="6">5泊以上</option>
    </select>
  </div>
  <div>
    <label for="budget">予算（総額・上限）</label>
    <select id="budget">
      <option value="">指定なし</option>
      <option value="80000">8万円まで</option>
      <option value="120000">12万円まで</option>
      <option value="180000">18万円まで</option>
      <option value="250000">25万円まで</option>
      <option value="400000">40万円まで</option>
      <option value="999999999">上限なし</option>
    </select>
  </div>
</div>

<div id="trip-map"></div>

<h2>検索結果</h2>
<ul id="result-list"></ul>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  var destinations = {{ site.data.destinations | jsonify }};

  var map = L.map('trip-map').setView([15, 120], 3);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  var islandIcon = L.divIcon({
    className: 'island-pin-wrapper',
    html: '<div class="island-pin"><span>🏝️</span></div>',
    iconSize: [30, 30],
    iconAnchor: [15, 28],
    popupAnchor: [0, -26]
  });

  var markers = {};
  destinations.forEach(function (d) {
    var marker = L.marker([d.lat, d.lng], { icon: islandIcon }).addTo(map);
    marker.bindPopup('<a href="{{ site.baseurl }}' + d.url + '">' + d.name + '</a>');
    markers[d.slug] = marker;
  });

  function renderResults() {
    var nights = parseInt(document.getElementById('nights').value, 10);
    var budget = document.getElementById('budget').value;
    var list = document.getElementById('result-list');
    list.innerHTML = '';

    var withTotals = destinations.map(function (d) {
      var totalMin = d.flight_min + d.daily_min * nights;
      var totalMax = d.flight_max + d.daily_max * nights;
      return Object.assign({}, d, { totalMin: totalMin, totalMax: totalMax });
    });

    var filtered = withTotals.filter(function (d) {
      var budgetOk = !budget || d.totalMin <= parseInt(budget, 10);
      return budgetOk;
    }).sort(function (a, b) { return a.totalMin - b.totalMin; });

    if (filtered.length === 0) {
      list.innerHTML = '<li class="no-result">条件に合う島がまだ見つかりませんでした。記事は随時追加中です。</li>';
      return;
    }

    filtered.forEach(function (d) {
      var li = document.createElement('li');
      li.innerHTML = '<a href="{{ site.baseurl }}' + d.url + '">' + d.name + '（' + d.country + '）</a>' +
        '　目安総額: ' + d.totalMin.toLocaleString() + '〜' + d.totalMax.toLocaleString() + '円' +
        '　おすすめ月: ' + d.best_months.join(', ') + '月';
      list.appendChild(li);
    });
  }

  document.getElementById('nights').addEventListener('change', renderResults);
  document.getElementById('budget').addEventListener('change', renderResults);
  renderResults();
</script>
