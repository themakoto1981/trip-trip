# 記事にする前に埋める必要がある情報（推測で埋めない）
open_questions:
  - "島はオアフ島のみか（ほかの島にも行ったか）"
  - "旅行の年月（2026年11月と推定）と、往復便の出発・到着時刻（現地泊と機内泊の内訳を出すため）"
  - "人数（大人・子供の内訳）。1人あたり費用を出すのに必須"
