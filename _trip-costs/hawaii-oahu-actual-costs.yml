# 実際にかかった旅費（体験記・予算記事の一次データ）
#
# 出典：まこと提供の割り勘スプレッドシート（2026-11-23受領）
# 元の表は旅行者全員での精算共有用。各自が自分で払って精算不要だった費用（例：航空券2人分）は
# 元の表に載っていないため、このファイルの合計は「旅行全体の総費用」ではない点に注意。
# 用途：②りさ／④しっぴへの受け渡し用。_で始まるフォルダなのでJekyllのビルド対象外（本番には出ない）。
#
# 公開時の注意：
# - 家族名・同行者名（支払い者、小項目内の人名）はこのファイルの時点で削除済み。記事にも載せない。
# - 割り勘・精算の内訳（誰が誰に払ったか）は記事に不要なので含めていない。
# - 行き先はハワイ（ユーザー確認済み、2026-11-23）。島はパールハーバー等の項目からオアフ島と推定。
# - 用途：「東南アジア vs ハワイ」の比較記事の、ハワイ側の実費データ（ユーザー指示、2026-11-23）。
#   ハワイ単体のガイド記事ではない（サイトの対象は東南アジア限定のまま）。
#   既存の東南アジア記事と組み合わせて新しいURL・新しい検索意図を作る記事なので、
#   CLAUDE.mdのフェーズ1の線引きでは「書いてよい」側に入る。

trip:
  destination: "ハワイ（確認済み）・オアフ島（推定）"
  article_use: "東南アジアとハワイの比較記事"
  dates: "2026-11-11〜2026-11-18（日本時間、ユーザー確認済み）"
  nights: "7泊8日（うち機内1泊）と推定。現地ホテル6泊（11/11〜11/16現地泊）"
  flights:
    outbound: "時刻未確認。日本を11/11夜に出て、ホノルルに11/11朝（現地）に着く夜行便と推定"
    return: "ホノルル 11/17 11:30ごろ発（現地）→ 日本 11/18 16:00ごろ着（日本時間）。昼の便なので機内泊なし（ユーザー確認済み）"
  travelers: 6   # 大人6人（ユーザー確認済み）。3家族×2人と推定（ESTAが4人分で1人$40相当になることと整合）
  exchange_rate_jpy_per_usd: 162.33   # シートの設定値。円換算はこのレート
  currency_note: "USD払いの行は usd に元の金額、jpy に換算額（1円未満四捨五入）を記載"

# 大項目ごとの合計（円）
totals_by_category:
  ホテル: 832159
  航空券: 470120      # 4人分のみ。残り2人分は本人が直接支払い済みで元の表に記載なし（金額未確認）
  食事: 109506
  買い物: 53433
  タクシー: 36358
  レンタカー: 34524
  ESTA: 26588
  食材: 21607
  バス: 11850
  駐車代: 4408
grand_total_jpy: 1600553   # 精算対象の費用のみ（航空券2人分など各自払いの費用は含まない）。 USD換算を行ごとに四捨五入しているため、シートの総額¥1,600,552と1円ずれる

# ===== 1人あたりコスト（比較記事で使う数字）=====
# 元の表にない山下家2人分の航空券・ESTAを、同額で補完した旅行全体の費用（ユーザー指示、2026-11-23）。
#   航空券：表の4人分 ¥470,120 ÷4 = ¥117,530/人 → 6人分 ¥705,180
#   ESTA ：表の4人分 ¥26,588 ÷4 = ¥6,647/人（≒$40.95）→ 6人分 ¥39,882
# 補完した2人分は「同額」とみなした推計値で、実際の支払額ではない。
# 1人あたりは各項目を四捨五入しているため、合計が総額÷6と1円ずれる。
