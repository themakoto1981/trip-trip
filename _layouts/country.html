---
layout: default
---
<article class="post h-entry">
  <header class="post-header">
    <h1 class="post-title">{{ page.flag }} {{ page.title }}</h1>
  </header>

  <div class="post-content e-content">
    {{ content }}
  </div>

  <h2>この国の島・ビーチ記事</h2>
  <ul class="country-island-list">
    {%- assign islands = site.data.destinations | where: "country_slug", page.slug -%}
    {%- for d in islands -%}
    <li><a href="{{ d.url | relative_url }}">{{ d.name }}</a></li>
    {%- else -%}
    <li>準備中です。近日公開予定。</li>
    {%- endfor -%}
  </ul>

  <p><a href="{{ '/countries/' | relative_url }}">← 国一覧に戻る</a></p>
</article>
